name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check frontend/app.js
      - name: Check local browser assistant syntax
        run: |
          node --check browser-assistant/server.js
          node --check browser-assistant/form-tools.js
      - name: Run Playwright companion unit tests
        run: node --test browser-assistant/test/*.test.js
