name: Clean merged feature branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-merged:
    runs-on: ubuntu-latest
    if: github.repository == 'HamzaZahid172/JobIntel-AI'
    steps:
      - name: Delete only verified merged feature and fix heads
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });
            let removed = 0;
            for (const branch of branches) {
              const name = branch.name;
              // Never touch long-lived, protected or unspecified branch names.
              if (!/^(feature|fix)\//.test(name) || branch.protected) continue;
              const pullRequests = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'closed', head: `${owner}:${name}`, per_page: 100
              });
              const merged = pullRequests.find(pr =>
                pr.merged_at &&
                ['develop', 'main'].includes(pr.base.ref) &&
                pr.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo &&
                pr.head.sha === branch.commit.sha
              );
              if (!merged) {
                core.info(`Keep ${name}: no merged PR with identical head commit`);
                continue;
              }
              try {
                const current = await github.rest.git.getRef({
                  owner, repo, ref: `heads/${name}`
                });
                if (current.data.object.sha !== branch.commit.sha) {
                  core.info(`Keep ${name}: new commits since branch listing`);
                  continue;
                }
                await github.rest.git.deleteRef({owner, repo, ref: `heads/${name}`});
                core.info(`Deleted merged ${name} (PR #${merged.number})`);
                removed++;
              } catch (error) {
                core.warning(`Could not safely delete ${name}: ${error.message}`);
              }
            }
            core.summary.addHeading('Merged-branch cleanup')
              .addRaw(`Removed ${removed} verified merged feature/fix branches. main, develop and unmerged branches were preserved.`)
              .write();
