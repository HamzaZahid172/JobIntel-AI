server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-JobIntel-Build "2026.10.27.1" always;

    # This dashboard changes frequently; never silently serve an old JS bundle.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-JobIntel-Build "2026.10.27.1" always;
    }
}
